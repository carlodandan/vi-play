<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c11" />
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests"
    />

    <!-- Standard Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />

    <!-- Apple Touch Icons (iOS Safari) -->
    <link rel="apple-touch-icon" href="/icons/apple-icon.png" />
    <link
      rel="apple-touch-icon"
      sizes="57x57"
      href="/icons/apple-icon-57x57.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="60x60"
      href="/icons/apple-icon-60x60.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="72x72"
      href="/icons/apple-icon-72x72.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="76x76"
      href="/icons/apple-icon-76x76.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="114x114"
      href="/icons/apple-icon-114x114.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/icons/apple-icon-120x120.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      href="/icons/apple-icon-144x144.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/apple-icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-icon-180x180.png"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="/icons/apple-icon-precomposed.png"
    />

    <!-- Android PWA & Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Microsoft Tiles (Windows) -->
    <meta name="msapplication-TileColor" content="#0b0c11" />
    <meta name="msapplication-TileImage" content="/icons/ms-icon-144x144.png" />
    <meta
      name="msapplication-square70x70logo"
      content="/icons/ms-icon-70x70.png"
    />
    <meta
      name="msapplication-square150x150logo"
      content="/icons/ms-icon-150x150.png"
    />
    <meta
      name="msapplication-square310x310logo"
      content="/icons/ms-icon-310x310.png"
    />

    <!-- Indexation and Discovery -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link
      rel="canonical"
      id="canonical-url"
      href="https://vi-play.pages.dev/"
    />

    <!-- Titles & Description -->
    <title id="meta-page-title">
      Vi-Play — Stream Movies, TV Shows & Anime in HD
    </title>
    <meta
      name="description"
      id="meta-description"
      content="Vi-Play is a modern edge-powered media streaming platform for Movies, TV Shows, and Anime. Stream in high definition with adaptive bitrate and multi-language subtitles."
    />

    <!-- Preconnect to TMDB image edge and Fonts for Core Web Vitals (LCP) -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vi-Play" />
    <meta
      property="og:title"
      id="og-title"
      content="Vi-Play — Stream Movies, TV Shows & Anime in HD"
    />
    <meta
      property="og:description"
      id="og-desc"
      content="Watch high-definition movies, TV shows, and anime with real-time stream aggregation, multi-language subtitles, and adaptive bitrate playback."
    />
    <meta property="og:url" id="og-url" content="https://vi-play.pages.dev/" />
    <meta
      property="og:image"
      id="og-image"
      content="https://vi-play.pages.dev/icons/android-icon-192x192.png"
    />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      id="twitter-title"
      content="Vi-Play — Stream Movies, TV Shows & Anime in HD"
    />
    <meta
      name="twitter:description"
      id="twitter-desc"
      content="Watch high-definition movies, TV shows, and anime with real-time stream aggregation, multi-language subtitles, and adaptive bitrate playback."
    />
    <meta
      name="twitter:image"
      id="twitter-image"
      content="https://vi-play.pages.dev/icons/android-icon-192x192.png"
    />

    <!-- Structured Data (JSON-LD) Site-wide Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://vi-play.pages.dev/#website",
            "url": "https://vi-play.pages.dev/",
            "name": "Vi-Play",
            "description": "Stream Movies, TV Shows, and Anime in high definition.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://vi-play.pages.dev/?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "WebApplication",
            "@id": "https://vi-play.pages.dev/#webapp",
            "name": "Vi-Play",
            "url": "https://vi-play.pages.dev/",
            "applicationCategory": "EntertainmentApplication",
            "operatingSystem": "All",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          }
        ]
      }
    </script>
    <script type="application/ld+json" id="dynamic-seo-schema"></script>
  </head>
  <body class="bg-[#090a0f] text-zinc-100 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
